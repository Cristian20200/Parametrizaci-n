name: Homologar prestador contra maestros
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Prestador.xlsx"
      - "CUPS.xlsx"
      - "Medicamentos.xlsx"
      - "insumos.xlsx"
      - "paquetes.xlsx"
      - "subcodigos.xlsx"
      - "traza.xlsx"
      - "scripts/homologar.py"
      - ".github/workflows/homologacion.yml"
permissions:
  contents: write
jobs:
  homologacion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias de similitud
        run: python -m pip install rapidfuzz
      - name: Inspeccionar estructura de traza
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from homologar import read_xlsx
          from itertools import islice
          for i, row in enumerate(islice(read_xlsx("traza.xlsx"), 4), 1):
              print(f"TRAZA FILA {i}: {row[:25]}")
          PY
      - name: Cruce y auditoría
        run: python scripts/homologar.py
      - name: Guardar resultados del prestador en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/resultado_homologacion.csv resultados/auditoria_homologacion.txt
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar resultados de homologación del prestador"
            git push
          fi
